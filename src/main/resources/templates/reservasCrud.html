<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <title>Reservas - Admin Eventos Aranda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .card {
            border-radius: 12px;
        }
        .table thead {
            background: #212529;
            color: #fff;
        }
    </style>
</head>

<body>
    <div class="container-fluid p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Reservas Activas</h2>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#reservaModal"
                onclick="abrirCrearReserva()">+ Nueva Reserva</button>
        </div>

        <div class="card p-3 mb-4 shadow-sm border-0">
            <table class="table table-striped align-middle">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Cliente</th>
                        <th>Evento</th>
                        <th>Fecha</th>
                        <th>Teléfono</th> <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="reserva : ${reservas}">
                        <td class="fw-bold px-3" th:text="${reserva.id}">1</td>

                        <td th:text="${reserva.cliente?.nombre}">Sin cliente</td>

                        <td th:text="${reserva.evento?.tipo}">Sin evento</td>
                        <td th:text="${reserva.fecha_reservada}">-</td>
                        <td th:text="${reserva.telefono}">-</td> <td>
                            <span class="badge rounded-pill bg-warning text-dark px-3 py-2"
                                th:if="${reserva.estado == 'PENDIENTE_CONFIRMACION' or reserva.estado == 'Pendiente'}">Pendiente</span>

                            <span class="badge rounded-pill bg-success px-3 py-2"
                                th:if="${reserva.estado == 'CONFIRMADA' or reserva.estado == 'Confirmada'}">Confirmada</span>

                            <span class="badge rounded-pill bg-secondary px-3 py-2"
                                th:unless="${reserva.estado == 'PENDIENTE_CONFIRMACION' or reserva.estado == 'CONFIRMADA' or reserva.estado == 'Pendiente' or reserva.estado == 'Confirmada'}"
                                th:text="${reserva.estado ?: 'N/A'}">Otro</span>
                        </td>
                        
                        <td>
                            <button class="btn btn-sm btn-outline-primary me-1" 
                                th:onclick="abrirEditarReserva([[${reserva.id}]], [[${reserva.cliente?.id}]], [[${reserva.evento?.id}]], [[${reserva.fecha_reservada}]], [[${reserva.telefono}]], [[${reserva.estado}]], [[${reserva.observaciones}]])">
                                <i class="bi bi-pencil-fill"></i>
                            </button>
                            <a th:href="@{/admin/reservas/eliminar/{id}(id=${reserva.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('¿Seguro que deseas eliminar esta reserva?');">
                                <i class="bi bi-trash-fill"></i>
                            </a>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(reservas)}">
                        <td colspan="7" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-1 d-block mb-3"></i>
                            Aún no hay eventos reservados.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="modal fade" id="reservaModal" tabindex="-1">
        <div class="modal-dialog">
            <form th:action="@{/admin/reservas/guardar}" th:object="${reserva}" method="post" class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="reservaModalLabel">Nueva Reserva</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" th:field="*{id}">
                    
                    <div class="mb-3">
                        <label>Cliente</label>
                        <select th:field="*{cliente}" class="form-select" required>
                            <option value="">-- Elige cliente --</option>
                            <option th:each="u : ${usuarios}" th:value="${u.id}" th:text="${u.nombre}">Cliente</option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label>Evento</label>
                        <select th:field="*{evento}" class="form-select" required>
                            <option value="">-- Elige evento --</option>
                            <option th:each="e : ${eventos}" th:value="${e.id}" th:text="${e.tipo}">Evento</option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label>Fecha</label>
                        <input type="date" th:field="*{fecha_reservada}" class="form-control" required>
                    </div>
                    
                    <div class="mb-3">
                        <label>Teléfono</label> <input type="text" th:field="*{telefono}" class="form-control" required>
                    </div>
                    
                    <div class="mb-3">
                        <label>Estado</label>
                        <select th:field="*{estado}" class="form-select">
                            <option value="Pendiente">Pendiente</option>
                            <option value="Confirmada">Confirmada</option>
                            <option value="Cancelada">Cancelada</option>
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label>Observaciones</label>
                        <textarea th:field="*{observaciones}" class="form-control" rows="3"></textarea>
                    </div>
                </div>
                
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar Reserva</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function abrirCrearReserva() {
            const form = document.querySelector('#reservaModal form');
            document.getElementById('reservaModalLabel').innerText = 'Nueva Reserva';
            form.action = '/admin/reservas/guardar';
            
            // Limpiar campos
            form.reset();
            form.querySelector('[name="id"]').value = '';

            const modal = new bootstrap.Modal(document.getElementById('reservaModal'));
            modal.show();
        }

        function abrirEditarReserva(id, clienteId, eventoId, fecha, telefono, estado, observaciones) {
            const form = document.querySelector('#reservaModal form');
            document.getElementById('reservaModalLabel').innerText = 'Editar Reserva';
            
            // Usamos la misma ruta de guardar porque el método save() actualiza si le mandas un ID
            form.action = '/admin/reservas/guardar';

            form.querySelector('[name="id"]').value = id;
            form.querySelector('[name="cliente"]').value = clienteId;
            form.querySelector('[name="evento"]').value = eventoId;
            form.querySelector('[name="fecha_reservada"]').value = fecha;
            form.querySelector('[name="telefono"]').value = telefono;
            form.querySelector('[name="estado"]').value = estado;
            form.querySelector('[name="observaciones"]').value = observaciones;

            const modal = new bootstrap.Modal(document.getElementById('reservaModal'));
            modal.show();
        }
    </script>
</body>

</html>
