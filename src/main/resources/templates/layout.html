<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" 
      lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE">Society Club</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    
    <style>
        /* Navbar con efecto vidrio (Glassmorphism) */
        .navbar-custom {
            background-color: rgba(15, 63, 94, 0.85); 
            backdrop-filter: blur(10px); 
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        /* Estilo de los enlaces */
        .navbar-custom .nav-link {
            color: rgba(255, 255, 255, 0.9) !important;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-size: 0.85rem;
            margin: 0 5px;
            transition: color 0.3s ease, transform 0.2s ease;
        }

        .navbar-custom .nav-link:hover {
            color: #f8c146 !important; 
            transform: translateY(-2px);
        }

        /* Ajuste del logo para que no estire la barra */
        .navbar-brand img.logo-img {
            object-fit: contain;
            transition: transform 0.3s ease;
            border-radius: 4px; /* Opcional: suaviza un poquito las esquinas del cuadro negro */
        }
        
        .navbar-brand img.logo-img:hover {
            transform: scale(1.05);
        }

        .login-icon {
            filter: invert(1) brightness(2); 
            opacity: 0.9;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .login-icon:hover {
            transform: scale(1.1);
            opacity: 1;
        }

        .footer-custom {
            background-color: #0b1220; 
            color: #a0aec0;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>
    <!-- Cambié 'py-2' a 'py-1' para reducir el alto del navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom py-1 fixed-top">
        <div class="container-fluid px-4">
            
            <a class="navbar-brand py-0" th:href="@{/}">
                <!-- Reduje el tamaño de 80 a 45 para que sea delgado y elegante -->
                <img th:src="@{/img/logo/LOGO.png}" alt="Logo" width="45" height="45" class="d-inline-block align-middle logo-img">
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" th:href="@{/}">Inicio</a></li>
                    <!-- <li class="nav-item"><a class="nav-link" href="#nosotros">Nosotros</a></li> -->
                    <li class="nav-item"><a class="nav-link" th:href="@{/servicios}">Servicios</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/reserva}">Reservar</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/cotizar}">Cotizar</a></li>
                    
                    <li class="nav-item ms-lg-4 mt-3 mt-lg-0">
                        <a class="nav-link p-0" th:href="@{/Login}">
                            <!-- Reduje ligeramente el icono de login para que acompañe el nuevo tamaño -->
                            <img th:src="@{/img/logo/person-circle.svg}" alt="Login" width="30" height="30" class="login-icon">
                        </a>
                    </li>
                </ul>
            </div>
            
        </div>
    </nav>

    <!-- Nos aseguramos de que el main no tenga padding arriba para que la foto suba hasta el fondo -->
    <main layout:fragment="content" style="min-height: 100vh; padding: 0; margin: 0;">
    </main>

    <footer class="footer-custom text-center p-4 mt-5">
        &copy; <span id="year"></span> Society Club - Todos los derechos reservados.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>

    <script layout:fragment="script"></script>
</body>
</html>
