<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de eventos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

     <style>
    :root {
        --dark-blue: #0B1220;
        --mid-blue: #103F5E;
        --deep-blue: #012A4A;
        --text-light: #ffffff;
    }
    body {
        display: flex;
        min-height: 100vh;
        background-color: #f8f9fa;
    }
    .sidebar {
        width: 260px;
        background: var(--dark-blue);
        color: var(--text-light);
        padding: 20px;
        display: flex;
        flex-direction: column;
    }
    .sidebar h4 { color: #fff; text-align: center; margin-bottom: 30px; }
    .sidebar a { 
        color: #b0c4de; 
        text-decoration: none; 
        padding: 12px 15px; 
        display: block; 
        border-radius: 8px; 
        transition: 0.3s;
    }
    .sidebar a:hover, .sidebar a.active { 
        background-color: var(--mid-blue); 
        color: #fff; 
    }
    .content { flex: 1; padding: 40px; }
    
    /* Componentes */
    .card { border: none; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .table thead { background: var(--deep-blue); color: #fff; }
    
    /* Botones */
    .btn-primary { background-color: var(--mid-blue); border-color: var(--mid-blue); }
    .btn-primary:hover { background-color: var(--deep-blue); border-color: var(--deep-blue); }
    
    .logout-btn { background-color: #4a1010; color: white; border: none; }
    .logout-btn:hover { background-color: #7a1b1b; }
</style>
</head>
<body class="bg-light">

      <!-- Sidebar -->
    <div class="sidebar d-flex flex-column p-3">
        <div>
            <h4><i class="bi bi-stars"></i> Society Club Eventos</h4>
            <ul class="nav flex-column mb-auto">
                <li><a href="#" th:href="@{/admin}"><i class="bi bi-speedometer2"></i> Panel General</a></li>
                <li><a href="#" th:href="@{/eventos}"><i class="bi bi-calendar-event"></i> Gestión de Eventos</a></li>
                <li><a href="#" th:href="@{/reservas}"><i class="bi bi-clipboard-check"></i> Reservas</a></li>
                <li><a href="#" th:href="@{/usuarios}"><i class="bi bi-people"></i> Usuarios</a></li>
                <li><a href="#" class="active"><i class="bi bi-bar-chart-line"></i> Reportes</a></li>
            </ul>
        </div>

        <div class="mt-4">
            <a th:href="@{/logout}" class="btn logout-btn w-100">
                <i class="bi bi-box-arrow-left"></i> Cerrar Sesión
            </a>
        </div>
    </div>

<div class="container mt-5">
    <h2 class="text-center mb-4">📊 Reporte de Eventos Reservados</h2>

    <div class="row">
        <!-- Gráfico de barras -->
        <div class="col-md-6">
            <div class="card shadow-sm p-3">
                <h5 class="text-center">Ventas realizadas por Mes</h5>
                <canvas id="graficoBarras" width="400" height="200"></canvas>
            </div>
        </div>

        <!-- Tabla de datos barras -->
        <div class="col-md-6">
            <div class="card shadow-sm p-3">
                <h5>Datos Mensuales</h5>
                <table class="table table-striped">
                    <thead>
                    <tr>
                        <th>Mes</th>
                        <th>Reservas</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="et, iterStat : ${etiquetas}">
                        <td th:text="${et}"></td>
                        <td th:text="${valores[iterStat.index]}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="row mt-4">
        <!-- Gráfico de pastel -->
        <div class="col-md-6">
            <div class="card shadow-sm p-3">
                <h5 class="text-center">Reservas por Tipo</h5>
                <canvas id="graficoPastel" width="400" height="300"></canvas>
            </div>
        </div>

        <!-- Tabla de datos pastel -->
        <div class="col-md-6">
            <div class="card shadow-sm p-3">
                <h5>Datos por Tipo</h5>
                <table class="table table-striped">
                    <thead>
                    <tr>
                        <th>Tipo de Evento</th>
                        <th>Cantidad</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="tp, iterStat : ${tipos}">
                        <td th:text="${tp}"></td>
                        <td th:text="${cantidades[iterStat.index]}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    const etiquetas = /*[[${etiquetas}]]*/ [];
    const valores = /*[[${valores}]]*/ [];
    const tipos = /*[[${tipos}]]*/ [];
    const cantidades = /*[[${cantidades}]]*/ [];

    // Gráfico de Barras
    const ctxBarras = document.getElementById('graficoBarras').getContext('2d');
    new Chart(ctxBarras, {
        type: 'bar',
        data: {
            labels: etiquetas,
            datasets: [{
                label: 'Reservas',
                data: valores,
                backgroundColor: 'rgba(75, 192, 192, 0.6)',
                borderColor: 'rgba(75, 192, 192, 1)',
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            scales: {
                y: { beginAtZero: true }
            }
        }
    });

    // Gráfico de Pastel
    const ctxPastel = document.getElementById('graficoPastel').getContext('2d');
    new Chart(ctxPastel, {
        type: 'pie',
        data: {
            labels: tipos,
            datasets: [{
                data: cantidades,
                backgroundColor: ['#36A2EB', '#FF6384', '#FFCE56']
            }]
        },
        options: { responsive: true }
    });
    /*]]>*/
</script>

</body>
</html>
