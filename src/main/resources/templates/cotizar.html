<!DOCTYPE html>
<html lang="es" 
      xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <meta charset="UTF-8">
    <title>Cotizar - Society Club</title>
</head>

<body class="bg-light">

    <div layout:fragment="content">
        
        <div class="container" style="padding-top: 120px; padding-bottom: 60px;">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card shadow-lg border-0 rounded-4">
                        <div class="card-body p-4 p-md-5">
                            
                            <h2 class="card-title mb-2 text-center fw-bold" style="color: #0b1220;">PIDE TU COTIZACIÓN</h2>
                            <p class="text-center text-muted mb-4">Déjanos tus datos y los detalles de tu evento. Te responderemos con una propuesta a medida.</p>
                            
                            <form id="clienteForm">
                                <div class="row g-4">
                                    
                                    <div class="col-md-6">
                                        <label for="nombre" class="form-label fw-medium">Nombre y Apellido</label>
                                        <input type="text" class="form-control px-3 py-2 bg-light border-0" id="nombre" placeholder="Ej: Juan Pérez" required>
                                    </div>
                                    
                                    <div class="col-md-6">
                                        <label for="correo" class="form-label fw-medium">Correo electrónico</label>
                                        <div class="input-group">
                                            <span class="input-group-text border-0 bg-light">@</span>
                                            <input type="email" class="form-control px-3 py-2 bg-light border-0" id="correo" placeholder="juan@ejemplo.com" required>
                                        </div>
                                    </div>

                                    <div class="col-md-6">
                                        <label for="numero" class="form-label fw-medium">Número de celular</label>
                                        <div class="input-group">
                                            <span class="input-group-text border-0 bg-light">
                                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-phone" viewBox="0 0 16 16">
                                                    <path d="M11 1a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1zM5 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2z"/>
                                                    <path d="M8 14a1 1 0 1 0 0-2 1 1 0 0 0 0 2"/>
                                                </svg>
                                            </span>
                                            <input type="tel" class="form-control px-3 py-2 bg-light border-0" id="numero" placeholder="987 654 321" required>
                                        </div>
                                    </div>

                                    <div class="col-md-6">
                                        <label for="servicio" class="form-label fw-medium">Servicio de interés</label>
                                        <select class="form-select px-3 py-2 bg-light border-0" id="servicio" required>
                                            <option value="" selected disabled>-- Elige un servicio --</option>
                                            <option value="cumpleaños">Cumpleaños</option>
                                            <option value="fiesta infantil">Fiesta infantil</option>
                                            <option value="baby shower">Baby shower</option>
                                            <option value="boda">Boda</option>
                                            <option value="evento corporativo">Evento Corporativo</option>
                                            <option value="quinceañero">Quinceañero</option>
                                            <option value="prom">Fiesta de promoción o graduación</option>
                                            <option value="bautizo">Bautizo</option>
                                            <option value="otro">Otro...</option>
                                        </select>
                                    </div>

                                    <div class="col-12">
                                        <label for="textarea1" class="form-label fw-medium">Detalles adicionales</label>
                                        <textarea class="form-control px-3 py-2 bg-light border-0" id="textarea1" rows="4" placeholder="Cuéntanos sobre la fecha tentativa, cantidad aproximada de invitados, temática, etc..." style="resize: none;"></textarea>
                                    </div>

                                    <div class="col-12 text-center mt-4">
                                        <button type="submit" class="btn btn-primary w-50 py-2 fs-5" style="background-color: #0f3f5e; border:none; border-radius: 8px;">Enviar Cotización</button>
                                    </div>

                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div> 
    
    <script layout:fragment="script">
        document.getElementById('clienteForm').addEventListener('submit', function(e) {
            e.preventDefault(); 
            
            // 1. Armamos el objeto con los datos
            const datosCotizacion = {
                nombre: document.getElementById('nombre').value,
                correo: document.getElementById('correo').value,
                numero: document.getElementById('numero').value,
                servicio: document.getElementById('servicio').value,
                detalles: document.getElementById('textarea1').value
            };

            const btnSubmit = document.querySelector('button[type="submit"]');
            const textoOriginal = btnSubmit.innerHTML;
            btnSubmit.innerHTML = 'Enviando...';
            btnSubmit.disabled = true;

            // 2. Enviamos al backend
            fetch('/api/cotizar/enviar', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(datosCotizacion)
            })
            .then(response => {
                if(response.ok) {
                    alert('¡Gracias! Hemos recibido tu solicitud y se ha guardado correctamente.');
                    document.getElementById('clienteForm').reset(); 
                } else {
                    alert('Hubo un error al procesar tu solicitud.');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error de conexión con el servidor.');
            })
            .finally(() => {
                btnSubmit.innerHTML = textoOriginal;
                btnSubmit.disabled = false;
            });
        });
    </script>

</body>
</html>
