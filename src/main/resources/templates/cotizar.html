<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
  <meta charset="UTF-8">
  <title>Eventos Aranda | Cotizar</title>
  <!-- Mantenemos tus tipografías -->
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
</head>

<body>

<!-- Fragmento que se inyecta en el layout -->
<div layout:fragment="content">

  <!-- Fondo gris muy clarito (bg-light) clásico y limpio -->
  <main class="bg-light pb-5 pt-5" style="min-height: 100vh;">
    <div class="container p-2 mt-5 pt-4">
      <div class="row">

        <div class="col-md-8 mx-auto">
          <!-- Tarjeta blanca sólida con sombra suave (shadow-sm) y bordes redondeados -->
          <div class="card shadow-sm border-0 rounded-3 p-4 bg-white">
            <div class="card-body">

              <!-- Título oscuro -->
              <h2 class="card-title mb-5 text-center fw-bold font-montserrat text-dark">Pide tu cotización aquí</h2>

              <form id="clienteForm">
                <div class="row g-4 mb-3">
                  <div class="col-md-6">
                    <label for="nombre" class="form-label fw-semibold text-dark">Nombre y Apellido</label>
                    <input type="text" class="form-control" id="nombre" placeholder="Ej. Juan Perez" required>
                  </div>

                  <div class="col-md-6">
                    <label for="correo" class="form-label fw-semibold text-dark">Correo electrónico</label>
                    <div class="input-group">
                      <span class="input-group-text bg-white border-end-0">@</span>
                      <input type="email" class="form-control border-start-0 ps-0" id="correo" placeholder="juan@gmail.com" required>
                    </div>
                  </div>
                </div>

                <div class="row g-4 mb-3">
                  <div class="col-md-6">
                    <label for="numero" class="form-label fw-semibold text-dark">Número de celular</label>
                    <div class="input-group">
                                            <span class="input-group-text bg-white border-end-0">
                                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-phone" viewBox="0 0 16 16">
                                                    <path d="M11 1a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1zM5 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2z"/>
                                                    <path d="M8 14a1 1 0 1 0 0-2 1 1 0 0 0 0 2"/>
                                                </svg>
                                            </span>
                      <input type="text" class="form-control border-start-0 ps-0" id="numero" placeholder="987 654 321" required>
                    </div>
                  </div>

                  <div class="col-md-6">
                    <label for="servicio" class="form-label fw-semibold text-dark">Tipo de Servicio</label>
                    <select class="form-select" id="servicio" required>
                      <option selected disabled value="">-- Elige un servicio --</option>
                      <option value="cumpleaños">Cumpleaños</option>
                      <option value="fiesta infantil">Fiesta infantil</option>
                      <option value="baby shower">Baby shower</option>
                      <option value="boda">Boda</option>
                      <option value="evento corporativo">Evento Corporativo</option>
                      <option value="quinceañero">Quinceañero</option>
                      <option value="prom">Fiesta de promoción o graduación</option>
                      <option value="bautizo">Bautizo</option>
                      <option value="otro">Otro...</option>
                    </select>
                  </div>
                </div>

                <div class="row mb-4">
                  <div class="col-12">
                    <label for="textarea1" class="form-label fw-semibold text-dark">Mensaje adicional (Opcional)</label>
                    <textarea class="form-control" id="textarea1" rows="4" placeholder="Cuéntanos más sobre lo que tienes en mente para tu evento..." style="resize: none"></textarea>
                  </div>
                </div>

                <div class="row mt-5">
                  <div class="col-sm-12 d-flex justify-content-center">
                    <!-- Botón azul sólido idéntico al de tu Login -->
                    <button type="submit" class="btn btn-primary btn-lg px-5 rounded-2 w-50 custom-btn">Enviar Cotización</button>
                  </div>
                </div>
              </form>

            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <style>
    /* Forzamos el fondo claro en toda la página */
    body, html {
      background-color: #f8f9fa !important;
    }

    .font-montserrat {
      font-family: 'Montserrat', sans-serif;
    }

    /* Estilo para los inputs de Bootstrap - Limpios y claros */
    .form-control, .form-select, .input-group-text {
      border-color: #dee2e6;
      color: #212529;
    }

    /* Efecto al hacer clic en los inputs (Focus) */
    .form-control:focus, .form-select:focus {
      border-color: #86b7fe;
      box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
    }

    /* Quita el borde azul del input group para que se vea como un solo campo */
    .input-group:focus-within .input-group-text {
      border-color: #86b7fe;
    }

    /* Botón estilo Login */
    .custom-btn {
      background-color: #0d6efd; /* Azul Bootstrap por defecto */
      border: none;
      font-weight: 500;
      transition: all 0.2s ease-in-out;
    }

    .custom-btn:hover {
      background-color: #0b5ed7;
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(13, 110, 253, 0.3);
    }
  </style>

</div>

</body>
</html>
