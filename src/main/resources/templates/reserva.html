<!DOCTYPE html>
<html lang="es" 
      xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <meta charset="UTF-8">
    <title>Reservar Evento - Society Club</title>
</head>

<body class="bg-light">

    <div layout:fragment="content">
        
        <div class="container" style="padding-top: 120px; padding-bottom: 60px;">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card shadow-lg border-0 rounded-4">
                        <div class="card-body p-4 p-md-5">
                            
                            <h2 class="card-title mb-2 text-center fw-bold" style="color: #0b1220;">RESERVA TU EVENTO</h2>
                            <p class="text-center text-muted mb-4">Verificaremos la disponibilidad al instante.</p>
                            
                            <form id="reservaForm">
                                <div class="row g-4">
                                    
                                    <div class="col-md-6">
                                        <label for="nombre" class="form-label fw-medium">Nombre y Apellido</label>
                                        <input type="text" class="form-control px-3 py-2 bg-light border-0" id="nombre" required>
                                    </div>
                                    
                                    <div class="col-md-6">
                                        <label for="correo" class="form-label fw-medium">Correo electrónico</label>
                                        <input type="email" class="form-control px-3 py-2 bg-light border-0" id="correo" required>
                                    </div>

                                    <div class="col-md-6">
                                        <label for="numero" class="form-label fw-medium">Número de celular</label>
                                        <input type="tel" class="form-control px-3 py-2 bg-light border-0" id="numero" required>
                                    </div>

                                    <div class="col-md-6">
                                        <label for="fecha" class="form-label fw-medium">Fecha del Evento</label>
                                        <input type="date" class="form-control px-3 py-2 bg-light border-0" id="fecha" required>
                                    </div>

                                    <div class="col-md-12">
                                        <label for="servicio" class="form-label fw-medium">Tipo de Evento</label>
                                        <select class="form-select px-3 py-2 bg-light border-0" id="servicio" required>
                                            <option value="" selected disabled>-- Elige un servicio --</option>
                                            <option value="cumpleaños">Cumpleaños</option>
                                            <option value="boda">Boda</option>
                                            <option value="quinceañero">Quinceañero</option>
                                            <option value="corporativo">Evento Corporativo</option>
                                            <option value="otro">Otro...</option>
                                        </select>
                                    </div>

                                    <div class="col-12">
                                        <label for="detalles" class="form-label fw-medium">Detalles adicionales</label>
                                        <textarea class="form-control px-3 py-2 bg-light border-0" id="detalles" rows="3"></textarea>
                                    </div>

                                    <div class="col-12 text-center mt-4">
                                        <button type="submit" class="btn btn-primary w-50 py-2 fs-5" style="background-color: #0f3f5e; border:none; border-radius: 8px;">Validar y Reservar</button>
                                    </div>

                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div> 
    
    <script layout:fragment="script">
        document.getElementById('reservaForm').addEventListener('submit', function(e) {
            e.preventDefault(); 
            
            const datosReserva = {
                nombre: document.getElementById('nombre').value,
                correo: document.getElementById('correo').value,
                numero: document.getElementById('numero').value,
                fecha: document.getElementById('fecha').value,
                servicio: document.getElementById('servicio').value,
                detalles: document.getElementById('detalles').value
            };

            const btnSubmit = document.querySelector('button[type="submit"]');
            const textoOriginal = btnSubmit.innerHTML;
            btnSubmit.innerHTML = 'Verificando...';
            btnSubmit.disabled = true;

            fetch('/api/reservar/enviar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datosReserva)
            })
            .then(async response => {
                const data = await response.json(); // Leemos la respuesta de Spring Boot
                
                if(response.ok) {
                    alert('✅ ' + data.mensaje);
                    document.getElementById('reservaForm').reset(); 
                } else {
                    // Si el backend envía código 400 (fecha ocupada), mostramos el mensaje de error
                    alert('❌ ' + data.error);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('❌ Ocurrió un error al comunicarse con el servidor.');
            })
            .finally(() => {
                btnSubmit.innerHTML = textoOriginal;
                btnSubmit.disabled = false;
            });
        });
    </script>

</body>
</html>
