<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Usuarios - Admin Eventos Aranda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
   <style>
    :root {
        --dark-blue: #0B1220;
        --mid-blue: #103F5E;
        --deep-blue: #012A4A;
        --text-light: #ffffff;
    }
    body {
        display: flex;
        min-height: 100vh;
        background-color: #f8f9fa;
    }
    .sidebar {
        width: 260px;
        background: var(--dark-blue);
        color: var(--text-light);
        padding: 20px;
        display: flex;
        flex-direction: column;
    }
    .sidebar h4 { color: #fff; text-align: center; margin-bottom: 30px; }
    .sidebar a { 
        color: #b0c4de; 
        text-decoration: none; 
        padding: 12px 15px; 
        display: block; 
        border-radius: 8px; 
        transition: 0.3s;
    }
    .sidebar a:hover, .sidebar a.active { 
        background-color: var(--mid-blue); 
        color: #fff; 
    }
    .content { flex: 1; padding: 40px; }
    
    /* Componentes */
    .card { border: none; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .table thead { background: var(--deep-blue); color: #fff; }
    
    /* Botones */
    .btn-primary { background-color: var(--mid-blue); border-color: var(--mid-blue); }
    .btn-primary:hover { background-color: var(--deep-blue); border-color: var(--deep-blue); }
    
    .logout-btn { background-color: #4a1010; color: white; border: none; }
    .logout-btn:hover { background-color: #7a1b1b; }
</style>
</head>
<body>

  <!-- Sidebar -->
    <div class="sidebar d-flex flex-column p-3">
        <div>
            <h4><i class="bi bi-stars"></i> Society Club Eventos</h4>
            <ul class="nav flex-column mb-auto">
                <li><a href="#" th:href="@{/admin}"><i class="bi bi-speedometer2"></i> Panel General</a></li>
                <li><a href="#" th:href="@{/eventos}"><i class="bi bi-calendar-event"></i> Gestión de Eventos</a></li>
                <li><a href="#" th:href="@{/reservas}"><i class="bi bi-clipboard-check"></i> Reservas</a></li>
                <li><a href="#" class="active"><i class="bi bi-people"></i> Usuarios</a></li>
                <li><a href="#" th:href="@{/reportes}"><i class="bi bi-bar-chart-line"></i> Reportes</a></li>
            </ul>
        </div>

        <div class="mt-4">
            <a th:href="@{/logout}" class="btn logout-btn w-100">
                <i class="bi bi-box-arrow-left"></i> Cerrar Sesión
            </a>
        </div>
    </div>

<div class="container-fluid p-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Usuarios Registrados</h2>
        <!-- Botón abrir modal crear -->
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#usuarioModal" onclick="abrirCrearUsuario()">+ Nuevo Usuario</button>
    </div>

    <div class="card p-3 mb-4">
        <table class="table table-striped">
            <thead>
            <tr>
                <th>#</th>
                <th>Nombre</th>
                <th>Email</th>
                <th>Rol</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u,iterStat : ${usuarios}">
                <td th:text="${iterStat.count}"></td>
                <td th:text="${u.nombre}"></td>
                <td th:text="${u.email}"></td>
                <td th:text="${u.rol}"></td>
                <td>
<button type="button" class="btn btn-sm btn-outline-secondary"
            th:attr="data-id=${u.id}, 
                     data-nombre=${u.nombre}, 
                     data-email=${u.email}, 
                     data-contraseña=${u.contraseña}, 
                     data-rol=${u.rol}"
            onclick="abrirEditarUsuario(this)">
        Editar
    </button>
                    
    <a th:href="@{'/admin/usuarios/eliminar/' + ${u.id}}" class="btn btn-sm btn-danger" onclick="return confirm('¿Eliminar usuario?')">Eliminar</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Modal Crear/Editar Usuario -->
<div class="modal fade" id="usuarioModal" tabindex="-1">
    <div class="modal-dialog">
        <form th:action="@{/admin/usuarios/guardar}" th:object="${usuario}" method="post" class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="usuarioModalLabel">Nuevo Usuario</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" th:field="*{id}">
                <div class="mb-3">
                    <label>Nombre</label>
                    <input type="text" th:field="*{nombre}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label>Email</label>
                    <input type="email" th:field="*{email}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label>Contraseña</label>
                    <input type="text" th:field="*{contraseña}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label>Rol</label>
                    <select th:field="*{rol}" class="form-select">
                        <option value="CLIENTE">CLIENTE</option>
                        <option value="ADMIN">ADMIN</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn btn-primary">Guardar</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
     function abrirCrearUsuario() {
        const form = document.querySelector('#usuarioModal form');
        document.getElementById('usuarioModalLabel').innerText = 'Nuevo Usuario';
        form.action = '/admin/usuarios/guardar';

  
        form.querySelector('[name="id"]').value = '';
        form.querySelector('[name="nombre"]').value = '';
        form.querySelector('[name="email"]').value = '';
        form.querySelector('[name="contraseña"]').value = '';
        form.querySelector('[name="rol"]').value = 'CLIENTE';

        const modal = new bootstrap.Modal(document.getElementById('usuarioModal'));
        modal.show();
    }

    function abrirEditarUsuario(btn) {
        const form = document.querySelector('#usuarioModal form');
        document.getElementById('usuarioModalLabel').innerText = 'Editar Usuario';
        form.action = '/admin/usuarios/actualizar';

        form.querySelector('[name="id"]').value = btn.dataset.id;
        form.querySelector('[name="nombre"]').value = btn.dataset.nombre;
        form.querySelector('[name="email"]').value = btn.dataset.email;
        form.querySelector('[name="contraseña"]').value = btn.dataset.contraseña;
        form.querySelector('[name="rol"]').value = btn.dataset.rol;

        const modal = new bootstrap.Modal(document.getElementById('usuarioModal'));
        modal.show();
    }
</script>
</body>
</html>
