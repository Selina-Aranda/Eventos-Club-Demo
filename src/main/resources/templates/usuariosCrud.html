<!DOCTYPE html>
<html lang="es" 
      xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
  <meta charset="UTF-8">
  <title>Ver Reservas - Society Club</title>
</head>

<body class="bg-light">

  <div layout:fragment="content">
    
    <!-- Contenedor principal con padding para que no se pegue al navbar -->
    <div class="container" style="padding-top: 120px; padding-bottom: 60px; min-height: 80vh;">
      
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold m-0" style="color: #012a4a; font-family: 'Montserrat', sans-serif;">Gestión de Reservas</h2>
        <a th:href="@{/reservar}" class="btn btn-outline-primary fw-bold"> + Nueva Reserva</a>
      </div>
      
      <!-- Tarjeta blanca que envuelve la tabla -->
      <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body p-4 table-responsive">
          
          <table class="table table-hover align-middle">
            <thead style="background-color: #012a4a; color: white;">
              <tr>
                <th scope="col" class="py-3 px-3 rounded-start"># ID</th>
                <th scope="col" class="py-3">Cliente</th>
                <th scope="col" class="py-3">Correo</th>
                <th scope="col" class="py-3">Teléfono</th>
                <th scope="col" class="py-3">Tipo de Evento</th>
                <th scope="col" class="py-3">Fecha del Evento</th>
                <th scope="col" class="py-3 rounded-end">Estado</th>
              </tr>
            </thead>
            
            <tbody>
              <!-- Este bloque se repite por cada reserva en la base de datos -->
              <tr th:each="reserva : ${reservas}">
                <td class="fw-bold px-3" th:text="${reserva.id}">1</td>
                
                <!-- Accedemos a los datos del Usuario relacionado -->
                <td th:text="${reserva.cliente.nombre}">Juan Perez</td>
                <td th:text="${reserva.cliente.email}">juan@gmail.com</td>
                
                <!-- Datos propios de la reserva -->
                <td th:text="${reserva.telefono}">987654321</td>
                
                <!-- Accedemos al dato del Evento relacionado -->
                <td th:text="${reserva.evento.tipo}">Boda</td>
                <td th:text="${reserva.fecha_reservada}">2026-08-15</td>
                
                <!-- Etiqueta de estado con colores dinámicos -->
                <td>
                  <span class="badge rounded-pill bg-warning text-dark px-3 py-2" 
                        th:if="${reserva.estado == 'PENDIENTE_CONFIRMACION'}">Pendiente</span>
                  
                  <span class="badge rounded-pill bg-success px-3 py-2" 
                        th:if="${reserva.estado == 'CONFIRMADA'}">Confirmada</span>
                  
                  <span class="badge rounded-pill bg-secondary px-3 py-2" 
                        th:unless="${reserva.estado == 'PENDIENTE_CONFIRMACION' or reserva.estado == 'CONFIRMADA'}" 
                        th:text="${reserva.estado}">Otro</span>
                </td>
              </tr>
              
              <!-- Si la lista está vacía, mostramos este mensaje -->
              <tr th:if="${#lists.isEmpty(reservas)}">
                <td colspan="7" class="text-center text-muted py-5">
                  <i class="bi bi-inbox fs-1 d-block mb-3"></i>
                  Aún no hay eventos reservados en la base de datos.
                </td>
              </tr>
            </tbody>
          </table>

        </div>
      </div>

    </div>
  </div> 

</body>
</html>
